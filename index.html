<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天蝎座 ♏</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap');

  :root {
    --bg: #08060e;
    --deep-red: #8b1a2b;
    --crimson: #c62840;
    --ember: #e84855;
    --gold: #d4a54a;
    --mystic: #3a1c5e;
    --star: #f0e6d3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Cormorant Garamond', serif;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(138, 26, 43, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(58, 28, 94, 0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(198, 40, 64, 0.08) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  /* Stars */
  .stars {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: var(--star);
    animation: twinkle var(--dur) ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.1; transform: scale(0.8); }
    100% { opacity: var(--max-o); transform: scale(1.2); }
  }

  /* Main container */
  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    animation: fadeIn 1.5s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* Scorpio glyph SVG */
  .glyph-wrapper {
    position: relative;
    width: 320px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow-ring {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    border: 1px solid rgba(198, 40, 64, 0.15);
    animation: pulseRing 4s ease-in-out infinite;
  }

  .glow-ring:nth-child(2) {
    width: 300px;
    height: 300px;
    animation-delay: 1s;
    border-color: rgba(212, 165, 74, 0.08);
  }

  .glow-ring:nth-child(3) {
    width: 340px;
    height: 340px;
    animation-delay: 2s;
    border-color: rgba(58, 28, 94, 0.12);
  }

  @keyframes pulseRing {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.08); opacity: 0.8; }
  }

  .glyph-svg {
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 30px rgba(198, 40, 64, 0.4))
            drop-shadow(0 0 60px rgba(138, 26, 43, 0.2));
  }

  .glyph-svg .main-stroke {
    fill: none;
    stroke: url(#scorpioGrad);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    animation: drawGlyph 2.5s ease forwards 0.5s;
  }

  @keyframes drawGlyph {
    to { stroke-dashoffset: 0; }
  }

  /* Scorpio M symbol */
  .scorpio-text {
    font-family: 'Cinzel Decorative', serif;
    font-size: 110px;
    font-weight: 900;
    fill: url(#textGrad);
    opacity: 0;
    animation: textReveal 1s ease forwards 2s;
  }

  @keyframes textReveal {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Info text */
  .title {
    font-family: 'Cinzel Decorative', serif;
    font-size: 14px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0;
    animation: fadeUp 1s ease forwards 2.5s;
    margin-top: -20px;
  }

  .subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: rgba(240, 230, 211, 0.35);
    opacity: 0;
    animation: fadeUp 1s ease forwards 2.8s;
    margin-top: 12px;
    font-style: italic;
  }

  .date-range {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    letter-spacing: 0.25em;
    color: rgba(198, 40, 64, 0.6);
    opacity: 0;
    animation: fadeUp 1s ease forwards 3s;
    margin-top: 8px;
    font-weight: 300;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Scorpion illustration */
  .scorpion {
    position: fixed;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.06;
    z-index: 0;
  }

  /* Particle embers */
  .ember {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--ember);
    opacity: 0;
    animation: float var(--dur) ease-in-out infinite;
  }

  @keyframes float {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    30% { opacity: 0.7; }
    70% { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-120px) scale(0); }
  }

  /* Scorpio constellation dots */
  .constellation {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0;
    animation: fadeIn 2s ease forwards 1.5s;
  }

  .const-dot {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--star);
    box-shadow: 0 0 6px var(--star);
    animation: starPulse 3s ease-in-out infinite;
  }

  .const-dot::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    top: -4px;
    left: -4px;
    border-radius: 50%;
    border: 1px solid rgba(240, 230, 211, 0.15);
    animation: starPulse 3s ease-in-out infinite reverse;
  }

  @keyframes starPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .const-line {
    position: absolute;
    height: 1px;
    background: linear-gradient(90deg, rgba(240,230,211,0.15), rgba(240,230,211,0.02));
    transform-origin: left center;
    animation: fadeIn 2s ease forwards 2s;
    opacity: 0;
  }
</style>
</head>
<body>

<!-- Stars background -->
<div class="stars" id="stars"></div>

<!-- Floating embers -->
<div class="ember" style="left:20%;bottom:30%;--dur:4s;animation-delay:0s;background:var(--crimson)"></div>
<div class="ember" style="left:35%;bottom:20%;--dur:5s;animation-delay:1s"></div>
<div class="ember" style="left:55%;bottom:35%;--dur:4.5s;animation-delay:2s;background:var(--gold)"></div>
<div class="ember" style="left:70%;bottom:25%;--dur:5.5s;animation-delay:0.5s;background:var(--crimson)"></div>
<div class="ember" style="left:80%;bottom:40%;--dur:4s;animation-delay:3s"></div>
<div class="ember" style="left:45%;bottom:15%;--dur:6s;animation-delay:1.5s;background:var(--gold)"></div>

<!-- Main content -->
<div class="container">
  <div class="glyph-wrapper">
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>

    <!-- Constellation dots -->
    <div class="constellation">
      <div class="const-dot" style="top:15%;left:25%"></div>
      <div class="const-dot" style="top:20%;left:35%;animation-delay:0.5s"></div>
      <div class="const-dot" style="top:28%;left:42%;animation-delay:1s"></div>
      <div class="const-dot" style="top:38%;left:48%;animation-delay:0.3s"></div>
      <div class="const-dot" style="top:50%;left:52%;animation-delay:0.8s"></div>
      <div class="const-dot" style="top:60%;left:55%;animation-delay:1.2s"></div>
      <div class="const-dot" style="top:70%;left:53%;animation-delay:0.6s"></div>
      <div class="const-dot" style="top:78%;left:60%;animation-delay:0.9s"></div>
      <div class="const-dot" style="top:82%;left:68%;animation-delay:1.5s"></div>
    </div>

    <!-- Scorpio symbol -->
    <svg class="glyph-svg" width="240" height="200" viewBox="0 0 240 200">
      <defs>
        <linearGradient id="scorpioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c62840"/>
          <stop offset="40%" stop-color="#e84855"/>
          <stop offset="70%" stop-color="#d4a54a"/>
          <stop offset="100%" stop-color="#c62840"/>
        </linearGradient>
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c62840"/>
          <stop offset="50%" stop-color="#e84855"/>
          <stop offset="100%" stop-color="#d4a54a"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- ♏ Scorpio glyph: M with curled tail -->
      <path class="main-stroke" filter="url(#glow)"
        d="M 30,140
           L 30,60
           L 60,110
           L 90,60
           L 120,110
           L 150,60
           L 150,140
           C 150,155 165,170 185,170
           C 205,170 215,155 215,140
           C 215,125 200,115 190,120
           C 180,125 180,135 190,138" />
    </svg>
  </div>

  <div class="title">Scorpio</div>
  <div class="subtitle">The Scorpion · Fixed Water Sign</div>
  <div class="date-range">10.23 — 11.21</div>
</div>

<!-- Large faint scorpion silhouette -->
<svg class="scorpion" width="600" height="300" viewBox="0 0 600 300" fill="none">
  <path d="M150,250 C130,230 100,200 90,170 C80,140 85,110 100,85
           C115,60 130,50 140,55 C150,60 148,80 140,95
           C132,110 120,120 115,130
           M100,85 C110,75 125,70 140,55
           M140,55 C155,45 175,50 185,65
           M185,65 C195,80 190,100 175,110
           C160,120 145,118 140,108
           M175,110 C190,120 210,125 225,118
           C240,111 245,95 235,82
           M225,118 C238,130 255,135 270,128
           C285,121 288,105 278,92
           M270,128 C283,140 300,145 315,138
           C330,131 333,115 323,102
           M315,138 C328,150 345,155 360,148
           C375,141 378,125 368,112
           M360,148 C370,158 375,170 370,182
           C365,194 350,200 340,195
           C330,190 330,178 338,172
           C346,166 355,170 355,178
           M370,182 C378,195 385,210 380,225
           C375,240 360,248 348,242
           C336,236 338,222 348,218
           C358,214 364,222 360,230
           M380,225 C390,238 395,255 388,270
           C381,285 365,292 352,284
           C339,276 343,260 354,256
           C365,252 370,262 365,270"
        stroke="rgba(198,40,64,0.15)" stroke-width="2" fill="none"/>
</svg>

<script>
  // Generate random stars
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 1;
    star.style.cssText = `
      width: ${size}px;
      height: ${size}px;
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      --dur: ${Math.random() * 4 + 2}s;
      --max-o: ${Math.random() * 0.6 + 0.2};
      animation-delay: ${Math.random() * 4}s;
    `;
    starsContainer.appendChild(star);
  }
</script>

</body>
</html>
