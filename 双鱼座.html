<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双鱼座 ♓</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap');

        :root {
            --bg: #050b16;
            --deep-ocean: #0d3b66;
            --ocean: #1a6b8a;
            --seafoam: #3ba0a8;
            --silver: #c8ddf0;
            --mystic: #3d2b6b;
            --star: #d8e8f6;
            --lavender: #7b6faf;
            --bubble: #a8d8ea;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(26, 107, 138, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 55%, rgba(61, 43, 107, 0.22) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 75%, rgba(59, 160, 168, 0.10) 0%, transparent 40%),
                radial-gradient(ellipse at 45% 30%, rgba(168, 216, 234, 0.06) 0%, transparent 35%);
            pointer-events: none;
            z-index: 0;
        }

        /* Stars */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: var(--star);
            animation: twinkle var(--dur) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.1;
                transform: scale(0.8);
            }
            100% {
                opacity: var(--max-o);
                transform: scale(1.2);
            }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: fadeIn 1.5s ease forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Glyph wrapper */
        .glyph-wrapper {
            position: relative;
            width: 320px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glow-ring {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 1px solid rgba(26, 107, 138, 0.18);
            animation: pulseRing 4s ease-in-out infinite;
        }

        .glow-ring:nth-child(2) {
            width: 300px;
            height: 300px;
            animation-delay: 1s;
            border-color: rgba(168, 216, 234, 0.10);
        }

        .glow-ring:nth-child(3) {
            width: 340px;
            height: 340px;
            animation-delay: 2s;
            border-color: rgba(61, 43, 107, 0.14);
        }

        @keyframes pulseRing {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.08);
                opacity: 0.8;
            }
        }

        .glyph-svg {
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 30px rgba(59, 160, 168, 0.45)) drop-shadow(0 0 60px rgba(26, 107, 138, 0.25)) drop-shadow(0 0 90px rgba(123, 111, 175, 0.15));
        }

        .glyph-svg .main-stroke {
            fill: none;
            stroke: url(#piscesGrad);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 700;
            stroke-dashoffset: 700;
            animation: drawGlyph 2.8s ease forwards 0.5s;
        }

        @keyframes drawGlyph {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* Pisces symbol text */
        .pisces-text {
            font-family: 'Cinzel Decorative', serif;
            font-size: 100px;
            font-weight: 900;
            fill: url(#textGrad);
            opacity: 0;
            animation: textReveal 1s ease forwards 2.2s;
        }

        @keyframes textReveal {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Info text */
        .title {
            font-family: 'Cinzel Decorative', serif;
            font-size: 14px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: var(--seafoam);
            opacity: 0;
            animation: fadeUp 1s ease forwards 2.7s;
            margin-top: -20px;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            letter-spacing: 0.35em;
            color: rgba(200, 221, 240, 0.38);
            opacity: 0;
            animation: fadeUp 1s ease forwards 3s;
            margin-top: 12px;
            font-style: italic;
        }

        .date-range {
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            letter-spacing: 0.25em;
            color: rgba(59, 160, 168, 0.65);
            opacity: 0;
            animation: fadeUp 1s ease forwards 3.2s;
            margin-top: 8px;
            font-weight: 300;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Fish illustration - two fish silhouettes */
        .fish-silhouettes {
            position: fixed;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.05;
            z-index: 0;
        }

        /* Floating bubbles */
        .bubble {
            position: fixed;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--bubble);
            opacity: 0;
            animation: floatUp var(--dur) ease-in-out infinite;
            box-shadow: 0 0 6px rgba(168, 216, 234, 0.5), 0 0 14px rgba(123, 111, 175, 0.3);
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.4);
            }
            25% {
                opacity: 0.65;
            }
            60% {
                opacity: 0.25;
            }
            100% {
                opacity: 0;
                transform: translateY(-130px) scale(0);
            }
        }

        /* Constellation dots */
        .constellation {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 2s ease forwards 1.5s;
        }

        .const-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--star);
            box-shadow: 0 0 7px var(--star), 0 0 16px rgba(168, 216, 234, 0.4);
            animation: starPulse 3s ease-in-out infinite;
        }

        .const-dot::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            top: -5px;
            left: -5px;
            border-radius: 50%;
            border: 1px solid rgba(200, 221, 240, 0.16);
            animation: starPulse 3s ease-in-out infinite reverse;
        }

        @keyframes starPulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        .const-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, rgba(200, 221, 240, 0.15), rgba(200, 221, 240, 0.02));
            transform-origin: left center;
            animation: fadeIn 2s ease forwards 2s;
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Stars background -->
    <div class="stars" id="stars"></div>

    <!-- Floating bubbles -->
    <div class="bubble" style="left:18%;bottom:28%;--dur:4.5s;animation-delay:0s;"></div>
    <div class="bubble" style="left:32%;bottom:18%;--dur:5.5s;animation-delay:1.2s;width:3px;height:3px;"></div>
    <div class="bubble" style="left:52%;bottom:32%;--dur:4s;animation-delay:2s;background:var(--silver);"></div>
    <div class="bubble" style="left:68%;bottom:22%;--dur:5s;animation-delay:0.6s;width:5px;height:5px;"></div>
    <div class="bubble" style="left:78%;bottom:38%;--dur:4.8s;animation-delay:3s;background:var(--lavender);"></div>
    <div class="bubble" style="left:42%;bottom:14%;--dur:6s;animation-delay:1.8s;width:3px;height:3px;background:var(--silver);"></div>
    <div class="bubble" style="left:25%;bottom:42%;--dur:5.2s;animation-delay:2.4s;width:5px;height:5px;"></div>
    <div class="bubble" style="left:60%;bottom:20%;--dur:4.3s;animation-delay:0.3s;"></div>

    <!-- Main content -->
    <div class="container">
        <div class="glyph-wrapper">
            <div class="glow-ring"></div>
            <div class="glow-ring"></div>
            <div class="glow-ring"></div>

            <!-- Constellation dots - Pisces V-shaped pattern -->
            <div class="constellation">
                <div class="const-dot" style="top:10%;left:22%"></div>
                <div class="const-dot" style="top:18%;left:30%;animation-delay:0.5s"></div>
                <div class="const-dot" style="top:30%;left:38%;animation-delay:1s"></div>
                <div class="const-dot" style="top:45%;left:44%;animation-delay:0.3s"></div>
                <div class="const-dot" style="top:55%;left:48%;animation-delay:0.8s"></div>
                <div class="const-dot" style="top:65%;left:52%;animation-delay:1.2s"></div>
                <div class="const-dot" style="top:72%;left:56%;animation-delay:0.6s"></div>
                <div class="const-dot" style="top:78%;left:50%;animation-delay:0.9s"></div>
                <div class="const-dot" style="top:82%;left:42%;animation-delay:1.5s"></div>
                <div class="const-dot" style="top:14%;left:60%;animation-delay:0.4s"></div>
                <div class="const-dot" style="top:22%;left:68%;animation-delay:1.1s"></div>
                <div class="const-dot" style="top:35%;left:74%;animation-delay:0.7s"></div>
            </div>

            <!-- Pisces glyph SVG -->
            <svg class="glyph-svg" width="240" height="200" viewBox="0 0 240 200">
                <defs>
                    <linearGradient id="piscesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1a6b8a" />
                        <stop offset="30%" stop-color="#3ba0a8" />
                        <stop offset="55%" stop-color="#7b6faf" />
                        <stop offset="80%" stop-color="#a8d8ea" />
                        <stop offset="100%" stop-color="#1a6b8a" />
                    </linearGradient>
                    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3ba0a8" />
                        <stop offset="40%" stop-color="#7b6faf" />
                        <stop offset="70%" stop-color="#a8d8ea" />
                        <stop offset="100%" stop-color="#3ba0a8" />
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <!-- ♓ Pisces glyph: two arcs connected in the middle -->
                <path class="main-stroke" filter="url(#glow)"
                d="M 60,28
                C 12,38 12,162 60,172
                M 60,100 L 180,100
                M 180,28
                C 228,38 228,162 180,172" />
            </svg>
        </div>

        <div class="title">Pisces</div>
        <div class="subtitle">The Fish · Mutable Water Sign</div>
        <div class="date-range">2.19 — 3.20</div>
    </div>

    <!-- Large faint two-fish silhouette -->
    <svg class="fish-silhouettes" width="600" height="320" viewBox="0 0 600 320" fill="none">
        <!-- Fish 1 - left, facing right -->
        <path d="M 80,200
        C 100,175 150,160 200,170
        C 230,175 250,190 255,200
        C 250,210 230,225 200,230
        C 150,240 100,225 80,200 Z"
        stroke="rgba(168,216,234,0.28)" stroke-width="2" fill="none" />
        <path d="M 195,200 L 170,185 M 195,200 L 170,215"
        stroke="rgba(168,216,234,0.22)" stroke-width="1.5" fill="none" />
        <!-- Fish 1 eye -->
        <circle cx="225" cy="196" r="4" fill="none" stroke="rgba(168,216,234,0.25)" stroke-width="1.5" />

        <!-- Fish 2 - right, facing left -->
        <path d="M 520,180
        C 500,155 450,140 400,150
        C 370,155 350,170 345,180
        C 350,190 370,205 400,210
        C 450,220 500,205 520,180 Z"
        stroke="rgba(123,111,175,0.25)" stroke-width="2" fill="none" />
        <path d="M 405,180 L 430,165 M 405,180 L 430,195"
        stroke="rgba(123,111,175,0.20)" stroke-width="1.5" fill="none" />
        <!-- Fish 2 eye -->
        <circle cx="375" cy="176" r="4" fill="none" stroke="rgba(123,111,175,0.22)" stroke-width="1.5" />

        <!-- Connecting wave / line between fish -->
        <path d="M 260,200 C 300,185 340,195 380,178"
        stroke="rgba(168,216,234,0.12)" stroke-width="1.5" fill="none" stroke-dasharray="8 12" />

        <!-- Water ripples -->
        <path d="M 40,250 Q 120,235 200,250 T 360,250 T 520,250 T 600,248"
        stroke="rgba(168,216,234,0.10)" stroke-width="1.5" fill="none" />
        <path d="M 60,268 Q 140,255 220,268 T 380,268 T 540,268 T 600,266"
        stroke="rgba(123,111,175,0.08)" stroke-width="1" fill="none" />
        <path d="M 20,286 Q 100,274 180,286 T 340,286 T 500,286 T 600,284"
        stroke="rgba(168,216,234,0.07)" stroke-width="1" fill="none" />

        <!-- Small star dots near fish -->
        <circle cx="100" cy="190" r="2" fill="rgba(200,221,240,0.20)" />
        <circle cx="270" cy="175" r="1.5" fill="rgba(200,221,240,0.18)" />
        <circle cx="330" cy="195" r="2" fill="rgba(200,221,240,0.16)" />
        <circle cx="480" cy="170" r="1.5" fill="rgba(200,221,240,0.20)" />
        <circle cx="150" cy="215" r="1.8" fill="rgba(200,221,240,0.14)" />
        <circle cx="440" cy="200" r="1.8" fill="rgba(200,221,240,0.15)" />
    </svg>

    <script>
        // Generate random stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.cssText = `
              width: ${size}px;
              height: ${size}px;
              left: ${Math.random() * 100}%;
              top: ${Math.random() * 100}%;
              --dur: ${Math.random() * 4 + 2}s;
              --max-o: ${Math.random() * 0.6 + 0.2};
              animation-delay: ${Math.random() * 4}s;
            `;
            starsContainer.appendChild(star);
        }
    </script>

</body>
</html>
